services:
  # 1. SERVIDOR DE MENSAJERÍA AMQP (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: urban_alert_mq
    # El entrypoint arregla ownership y baja a rabbitmq mediante su-exec.
    user: "0:0"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=urban_user
      - RABBITMQ_DEFAULT_PASS=urban_secure_pass
    # Sonda de salud de infraestructura: Verifica que el broker acepte conexiones
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s    # Cada cuánto tiempo evalúa
      timeout: 5s     # Tiempo máximo de espera de respuesta
      retries: 3      # Intentos permitidos antes de marcar 'unhealthy'
      start_period: 15s # Ventana inicial de gracia para el arranque del servicio

  # 2. ALMACÉN CLAVE-VALOR EN MEMORIA (Redis)
  redis:
    image: redis:7.2-alpine
    container_name: urban_alert_cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  mongodb:
    image: mongo:7.0
    container_name: urban_alert_nosql
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=urban_alert_media
    volumes:
      - multimedia_metadata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=audit_admin
      - POSTGRES_PASSWORD=audit_admin_secure_pass
      - POSTGRES_DB=urban_alert_audit
    volumes:
      - audit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_admin -d urban_alert_audit"]
      interval: 5s
      timeout: 3s
      retries: 10

  audit_migrate:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["psql -h audit_db -U audit_admin -d urban_alert_audit -v ON_ERROR_STOP=1 -f /migrations/001_audit_store.sql"]
    environment:
      - PGPASSWORD=audit_admin_secure_pass
    volumes:
      - ./audit_init/001_audit_store.sql:/migrations/001_audit_store.sql:ro
    depends_on:
      audit_db:
        condition: service_healthy

  seaweed-s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-s3.iam=false"]
    ports:
      - "8333:8333"
    volumes:
      - seaweed_s3_data:/data
      - ./s3_local.json:/etc/seaweedfs/s3.json:ro

  s3_init:
    build: .
    restart: "no"
    command: ["python", "-m", "core_services.create_dev_bucket"]
    volumes:
      - ./core_services:/app/core_services
    environment:
      - S3_BUCKET=urban-alert-evidencias
      - S3_ENDPOINT_URL=http://seaweed-s3:8333
      - AWS_REGION=us-east-1
      - S3_ACCESS_KEY_ID=urban_minio
      - S3_SECRET_ACCESS_KEY=urban_minio_secure_pass
      - PYTHONPATH=/app
    depends_on:
      seaweed-s3:
        condition: service_started

  # 3. BASE DE DATOS CORE - PRIMARIA
  core_db_primary:
    image: postgres:16-alpine
    container_name: urban_alert_core_primary
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_USER=core_admin
      - POSTGRES_PASSWORD=core_secure_pass
      - POSTGRES_DB=urban_alert_core
    command: >
      postgres 
      -c wal_level=replica 
      -c max_wal_senders=5 
      -c max_connections=100
    volumes:
      - core_primary_data:/var/lib/postgresql/data
      - ./core_init:/docker-entrypoint-initdb.d
    # Sonda que garantiza que la base transaccional esté lista para recibir conexiones SQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_admin -d urban_alert_core"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. BASE DE DATOS CORE - RÉPLICA STANDBY (Redundancia Activa - QAS-06)
  core_db_replica:
    image: postgres:16-alpine
    container_name: urban_alert_core_replica
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=core_admin
      - POSTGRES_PASSWORD=core_secure_pass
      - POSTGRES_DB=urban_alert_core
    # Dependencia estricta de la condición de salud (No arranca hasta que la primaria esté 'healthy')
    depends_on:
      core_db_primary:
        condition: service_healthy
    command: >
      sh -c "
      until pg_isready -h core_db_primary -p 5432; do echo waiting for primary; sleep 1; done;
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        pg_basebackup -h core_db_primary -D /var/lib/postgresql/data -U core_admin -Fp -Xs -R;
      fi;
      exec postgres -c hot_standby=on
      "
    volumes:
      - core_replica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_admin -d urban_alert_core"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 5. MOTOR DE BASE DE DATOS GEOESPACIAL AISLADO (PostGIS - QAS-05)
  postgis_db:
    image: postgis/postgis:16-3.4-alpine
    container_name: urban_alert_gis_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=gis_admin
      - POSTGRES_PASSWORD=gis_secure_pass
      - POSTGRES_DB=urban_alert_geo
    command: ["postgres", "-c", "max_connections=50"]
    volumes:
      - gis_data:/var/lib/postgresql/data
      - ./postgis_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_admin -d urban_alert_geo"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # SERVICIOS DE CÓMPUTO FAAS (Consumidores Asíncronos con auto-recuperación)
  # =========================================================================

  core_api:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "core_services.app"]
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./core_services:/app/core_services
      - ./validar:/app/validar:ro
    environment:
      - DATABASE_PRIMARY_URL=postgresql://app_core_user:app_secure_pass@core_db_primary:5432/urban_alert_core
      - GEOSPATIAL_API_URL=http://service_geospatial:5000
      - S3_BUCKET=urban-alert-evidencias
      - S3_ENDPOINT_URL=http://seaweed-s3:8333
      - S3_PRESIGN_ENDPOINT_URL=http://localhost:8333
      - AWS_REGION=us-east-1
      - S3_ACCESS_KEY_ID=urban_minio
      - S3_SECRET_ACCESS_KEY=urban_minio_secure_pass
      - UPLOAD_URL_TTL_SECONDS=300
      - DOWNLOAD_URL_TTL_SECONDS=300
      - MAX_UPLOAD_BYTES=15728640
      - ALLOW_TEST_USER_CONTEXT=true
      - GATEWAY_SHARED_SECRET=urban-alert-local-gateway-secret-change-before-deploy
      - PORT=5000
      - PYTHONPATH=/app
    depends_on:
      core_migrate:
        condition: service_completed_successfully
      s3_init:
        condition: service_completed_successfully

  core_migrate:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["psql -h core_db_primary -U core_admin -d urban_alert_core -v ON_ERROR_STOP=1 -f /migrations/002_business_services.sql"]
    environment:
      - PGPASSWORD=core_secure_pass
    volumes:
      - ./core_init/002_business_services.sql:/migrations/002_business_services.sql:ro
    depends_on:
      core_db_primary:
        condition: service_healthy

  outbox_relay:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "core_services.outbox_relay"]
    volumes:
      - ./core_services:/app/core_services
      - ./validar:/app/validar:ro
    environment:
      - DATABASE_PRIMARY_URL=postgresql://app_core_user:app_secure_pass@core_db_primary:5432/urban_alert_core
      - BROKER_URL=amqp://urban_user:urban_secure_pass@rabbitmq:5672/%2F
      - PYTHONPATH=/app
    depends_on:
      core_db_primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  service_geospatial:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "core_services.geospatial"]
    ports:
      - "5002:5000"
    volumes:
      - ./core_services:/app/core_services
      - ./validar:/app/validar:ro
    environment:
      - DATABASE_GEO_URL=postgresql://analista_obras:read_only_gis_pass@postgis_db:5432/urban_alert_geo
      - PORT=5000
      - ALLOW_TEST_USER_CONTEXT=true
      - PYTHONPATH=/app
    depends_on:
      postgis_migrate:
        condition: service_completed_successfully

  postgis_migrate:
    image: postgis/postgis:16-3.4-alpine
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["psql -h postgis_db -U gis_admin -d urban_alert_geo -v ON_ERROR_STOP=1 -f /migrations/002_reportes_geo.sql"]
    environment:
      - PGPASSWORD=gis_secure_pass
    volumes:
      - ./postgis_init/002_reportes_geo.sql:/migrations/002_reportes_geo.sql:ro
    depends_on:
      postgis_db:
        condition: service_healthy

  geospatial_projector:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "core_services.geospatial_projector"]
    volumes:
      - ./core_services:/app/core_services
      - ./validar:/app/validar:ro
    environment:
      - DATABASE_GEO_URL=postgresql://svc_geo_projector:geo_projector_secure_pass@postgis_db:5432/urban_alert_geo
      - BROKER_URL=amqp://urban_user:urban_secure_pass@rabbitmq:5672/%2F
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      postgis_migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  fn_notifications:
    build: .
    restart: always  # TÁCTICA DE RECUPERACIÓN: Si el contenedor muere o cae, Docker lo levanta solo
    volumes:
      - ./fn_notifications:/app
      - ./validar:/app/validar:ro
    command: ["python", "app.py"]
    environment:
      - BROKER_URL=amqp://urban_user:urban_secure_pass@rabbitmq:5672/%2F
      - AUDIT_DATABASE_URL=postgresql://audit_writer:audit_writer_secure_pass@audit_db:5432/urban_alert_audit
      - PYTHONPATH=/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      audit_migrate:
        condition: service_completed_successfully

  fn_audit:
    build: .
    restart: always
    volumes:
      - ./fn_audit:/app
      - ./validar:/app/validar:ro
    command: ["python", "app.py"]
    environment:
      - BROKER_URL=amqp://urban_user:urban_secure_pass@rabbitmq:5672/%2F
      - AUDIT_DATABASE_URL=postgresql://audit_writer:audit_writer_secure_pass@audit_db:5432/urban_alert_audit
      - PYTHONPATH=/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      audit_migrate:
        condition: service_completed_successfully

  fn_multimedia:
    build: .
    restart: always
    volumes:
      - ./fn_multimedia:/app
      - ./validar:/app/validar:ro
    command: ["python", "app.py"]
    environment:
      - BROKER_URL=amqp://urban_user:urban_secure_pass@rabbitmq:5672/%2F
      - MONGO_URL=mongodb://mongodb:27017
      - MONGO_DATABASE=urban_alert_media
      - PYTHONPATH=/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  rabbitmq_data:
  audit_data:
  seaweed_s3_data:
  gis_data:
  core_primary_data:
  core_replica_data:
  multimedia_metadata:
